<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>料理ゲーム</title>

    <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="../../shared/game-links.css" />
</head>

  <body>
    <button id="menuBtn" onclick="toggleMenu()">☰</button>

    <div id="menu">
      <button onclick="showScreen('gameScreen')">🍳料理</button>
      <button onclick="showScreen('shopScreen')">🛒ショップ</button>
      <button onclick="showScreen('bookScreen')">📖図鑑</button>
      <button onclick="showScreen('achievementScreen')">🏆実績</button>
    </div>

    <div id="gameScreen" class="screen active">
      <h1>🍳ミッション料理ゲーム🍳</h1>
<!-- BEGIN GENERATED: game-links -->
<nav class="game-page-links" aria-label="ゲームの案内">
  <a class="game-manual" href="../../wiki/cooking.html">📖 説明書</a>
  <a class="game-ranking" href="../../ranking/index.html?game=cooking">🏆 ランキング</a>
</nav>
<script type="module" src="../../shared/play-count-client.mjs"></script>
<!-- END GENERATED: game-links -->


      <button onclick="startGame()">▶️スタート</button>

      <br />

      <div id="rankBox"></div>

      <br />

      <div id="mission">ミッション：スタートを押そう！</div>

      <p id="message">スタートしてね！</p>

      <div id="dish"></div>

      <h2>🍽️使える食材</h2>
      <div id="foodButtons"></div>

      <div id="actions"></div>

      <div class="bowl-area">
        <div id="bowlItems"></div>
        <div class="bowl"></div>
      </div>

      <button onclick="mix()">🌀混ぜる！</button>
      <button id="passBtn" onclick="passMission()">⏩パス</button>
      <button id="nextBtn" onclick="startGame()">➡️次のミッション</button>
    </div>

    <div id="shopScreen" class="screen">
      <h1>🛒ショップ</h1>
      <div id="shopBox">
        <h2 id="shopMoney">💰お金：0</h2>
        <div id="shopItems"></div>
      </div>
    </div>

    <div id="bookScreen" class="screen">
      <h1>📖料理図鑑</h1>
      <div id="bookBox"></div>
    </div>

    <div id="achievementScreen" class="screen">
      <h1>🏆実績</h1>
      <div id="achievementBox"></div>
      <br />
      <div id="historyBox">
        📖作った料理<br />
        まだないよ
      </div>
    </div>

    <script type="module" src="../../shared/leaderboard-client.mjs"></script>
<script src="rules.js"></script>
<script src="data.js"></script>
<script src="state.js"></script>
<script src="game.js"></script>
  </body>
</html>
