<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>こうちゃん地獄基地防衛 全部版</title>
    <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="../../shared/game-links.css" />
</head>
  <body>
    <h1>☠️ こうちゃん地獄基地防衛 全部版 ☠️</h1>
<!-- BEGIN GENERATED: game-links -->
<nav class="game-page-links" aria-label="ゲームの案内">
  <a class="game-manual" href="../../wiki/defense.html">📖 説明書</a>
  <a class="game-ranking" href="../../ranking/index.html?game=base-defense">🏆 ランキング</a>
</nav>
<!-- END GENERATED: game-links -->

    <div id="hud"></div>
    <div id="shop">
      <div class="shop-group">
        <h3>🔫 ぶき（タワー）</h3>
        <div class="shop-grid">
          <button
            class="tool-btn"
            data-mode="turret"
            data-cost="50"
            data-power="1"
            onclick="selectTool('turret')"
            ><b>🔫 銃</b><span class="price">💰50 ⚡1</span></button
          >
          <button
            class="tool-btn"
            data-mode="laser"
            data-cost="120"
            data-power="3"
            onclick="selectTool('laser')"
            ><b>⚡ レーザー</b><span class="price">💰120 ⚡3</span></button
          >
          <button
            class="tool-btn"
            data-mode="cannon"
            data-cost="150"
            data-power="4"
            onclick="selectTool('cannon')"
            ><b>💥 爆発砲</b><span class="price">💰150 ⚡4</span></button
          >
          <button
            class="tool-btn"
            data-mode="blackhole"
            data-cost="250"
            data-power="5"
            onclick="selectTool('blackhole')"
            ><b>🕳️ ブラックホール</b><span class="price">💰250 ⚡5</span></button
          >
        </div>
      </div>
      <div class="shop-group">
        <h3>🧱 ぼうぎょ（かべ・トラップ）</h3>
        <div class="shop-grid">
          <button
            class="tool-btn"
            data-mode="wall"
            data-cost="25"
            data-power="0"
            onclick="selectTool('wall')"
            ><b>🪵 壁</b><span class="price">💰25</span></button
          >
          <button
            class="tool-btn"
            data-mode="spike"
            data-cost="40"
            data-power="0"
            onclick="selectTool('spike')"
            ><b>🔺 トゲ</b><span class="price">💰40</span></button
          >
          <button
            class="tool-btn"
            data-mode="mine"
            data-cost="60"
            data-power="0"
            onclick="selectTool('mine')"
            ><b>💣 地雷</b><span class="price">💰60</span></button
          >
        </div>
      </div>
      <div class="shop-group">
        <h3>🤖 なかま（ロボット）</h3>
        <div class="shop-grid">
          <button class="act-btn" data-cost="180" onclick="buyRobot()"
            ><b>🤖 ロボ</b><span class="price">💰180</span></button
          >
          <button class="act-btn" data-cost="220" onclick="buyBomberRobot()"
            ><b>💣 自爆ロボ</b><span class="price">💰220</span></button
          >
        </div>
      </div>
      <div class="shop-group">
        <h3>🏰 きょうか（基地・修理）</h3>
        <div class="shop-grid">
          <button class="act-btn" data-cost="100" onclick="expandBase()"
            ><b>⬜ 基地拡張</b><span class="price">💰100</span></button
          >
          <button class="act-btn" data-cost="120" onclick="buyPower()"
            ><b>⚡ 発電強化</b><span class="price">💰120</span></button
          >
          <button class="act-btn" data-cost="80" onclick="repair()"
            ><b>🔧 修理</b><span class="price">💰80</span></button
          >
        </div>
      </div>
      <div class="shop-group">
        <h3>🎮 ゲーム</h3>
        <div class="shop-grid">
          <button class="start-btn" onclick="start()"><b>▶️ スタート</b></button>
        </div>
      </div>
    </div>
    <div id="stage"
      ><div id="game"><div id="message">基地を作れ！</div></div></div
    >
    <div id="controls">
      <div class="pad">
        <button class="ctrl" id="up">↑</button>
        <div class="pad-mid">
          <button class="ctrl" id="left">←</button>
          <button class="ctrl shoot" id="shoot">うつ<br />💥</button>
          <button class="ctrl" id="right">→</button>
        </div>
        <button class="ctrl" id="down">↓</button>
      </div>
    </div>

    <script type="module" src="../../shared/leaderboard-client.mjs"></script>
<script src="rules.js"></script>
<script src="game.js"></script>
  </body>
</html>
