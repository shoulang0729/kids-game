<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ようちゃんバトル ULTIMATE GOD</title>

    <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="../../shared/game-links.css" />
</head>

  <body>
    <!-- モード -->

    <div id="selectScreen" class="screen">
      <h1>⚔️ ようちゃんバトル</h1>
<!-- BEGIN GENERATED: game-links -->
<nav class="game-page-links" aria-label="ゲームの案内">
  <a class="game-manual" href="../../wiki/index.html#battle">📖 説明書</a>
  <a class="game-ranking" href="../../ranking/index.html?game=youchan-battle">🏆 ランキング</a>
</nav>
<!-- END GENERATED: game-links -->


      <h2>🎮 モード選択</h2>

      <button class="modeBtn" onclick="showStoryMap()"> 📖 ストーリー </button>

      <button class="modeBtn" onclick="startInfinite()"> ♾️ 無限モード </button>

      <button class="modeBtn" onclick="startDefense()"> 🏰 防衛モード </button>
    </div>

    <!-- マップ -->

    <div id="mapScreen" class="screen">
      <h1>🗺️ 冒険マップ</h1>

      <div class="mapNode" onclick="enterNode(1)"> 🌲 森の入口 </div>

      <div class="line">↓</div>

      <div class="mapNode" onclick="enterNode(2)"> 🎁 宝箱 </div>

      <div class="line">↓</div>

      <div class="mapNode" onclick="enterNode(3)"> 🕳️ 闇の洞窟 </div>

      <div class="line">↓</div>

      <div class="mapNode" onclick="enterNode(4)"> 💚 回復の泉 </div>

      <div class="line">↓</div>

      <div class="mapNode" onclick="enterNode(5)"> 🌋 火山鬼 </div>

      <div class="line">↓</div>

      <div class="mapNode" onclick="enterNode(6)"> 🐉 ドラゴン城 </div>

      <div class="line">↓</div>

      <div class="mapNode" onclick="enterNode(7)"> 👑 宇宙魔王 </div>

      <button onclick="showSelect()"> 戻る </button>
    </div>

    <!-- バトル -->

    <div id="battleScreen" class="screen">
      <h1 id="title"> ⚔️ バトル </h1>
<!-- BEGIN GENERATED: battle-links -->
<nav class="game-page-links" aria-label="ゲームの案内">
  <a class="game-manual" href="../../wiki/index.html#battle">📖 説明書</a>
  <a class="game-ranking" href="../../ranking/index.html?game=youchan-battle">🏆 ランキング</a>
</nav>
<!-- END GENERATED: battle-links -->


      <div id="waveText" class="wave"> </div>

      <div class="weaponBox">
        <h2>
          ⚔️ 武器:
          <span id="weaponText"> 🗡️ 木の剣 +0 </span>
        </h2>

        <h2>
          🧬 レベル:
          <span id="levelText"> 1 </span>
        </h2>

        <h2>
          EXP:
          <span id="expText"> 0 </span>

          /

          <span id="nextExpText"> 100 </span>
        </h2>
      </div>

      <h2>❤️ プレイヤーHP</h2>

      <div class="bar">
        <div id="playerBar" class="fill"> </div>
      </div>

      <h2>👾 敵HP</h2>

      <div class="bar">
        <div id="enemyBar" class="fill"> </div>
      </div>

      <div id="baseArea">
        <h2>🏯 基地HP</h2>

        <div class="bar">
          <div id="baseBar" class="fill"> </div>
        </div>
      </div>

      <div id="enemy">👾</div>

      <button id="attackBtn" onclick="useSkill('attack')"> ⚔️ 攻撃 </button>

      <button id="fireBtn" onclick="useSkill('fire')"> 🔥 ファイヤー </button>

      <button id="thunderBtn" onclick="useSkill('thunder')"> ⚡ サンダー </button>

      <button id="healBtn" onclick="useSkill('heal')"> 💚 回復 </button>

      <button id="ultimateBtn" onclick="useSkill('ultimate')"> 🌈 必殺技 </button>

      <button id="defendBtn" onclick="defend()"> 🛡️ 防御 </button>

      <br />

      <!-- 武器ショップ -->

      <button class="shopBtn" onclick="buyWeapon('fire')"> 🔥 炎ソード 300 </button>

      <button class="shopBtn" onclick="buyWeapon('thunder')"> ⚡ 雷神剣 700 </button>

      <button class="shopBtn" onclick="buyWeapon('cosmo')"> 🌌 宇宙剣 1500 </button>

      <button class="shopBtn" onclick="buyWeapon('god')"> 👑 GOD剣 5000 </button>

      <br />

      <!-- 強化 -->

      <button class="shopBtn" onclick="buyUpgrade('hp')"> ❤️ HP強化 100 </button>

      <button class="shopBtn" onclick="buyUpgrade('attack')"> ⚔️ 攻撃強化 100 </button>

      <button class="shopBtn" onclick="buyUpgrade('base')"> 🏯 基地回復 150 </button>

      <button class="shopBtn" onclick="buyUpgrade('robot')"> 🤖 ロボ兵 300 </button>

      <button class="shopBtn" onclick="buyUpgrade('cannon')"> 🔫 砲台 500 </button>

      <h2>
        💰 コイン:
        <span id="coinsText"> 0 </span>
      </h2>

      <h2>
        🤖 ロボ兵:
        <span id="robotText"> 0 </span>
      </h2>

      <h2>
        🔫 砲台:
        <span id="cannonText"> 0 </span>
      </h2>

      <div id="log"></div>
    </div>

    <script type="module" src="../../shared/leaderboard-client.mjs"></script>
<script src="rules.js"></script>
<script src="data.js"></script>
<script src="state.js"></script>
<script src="game.js"></script>
  </body>
</html>
