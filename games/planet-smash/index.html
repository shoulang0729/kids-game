<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>攻撃で少し稼ぐ 惑星ぶっこわし3D</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>🌌💰 攻撃で少し稼ぐ 惑星ぶっこわし3D 💰🌌</h1>

    <div class="panel">
      ステージ：<span id="stageName"></span><br />
      お金：<span id="money">0</span>円<br />
      選択攻撃：<span id="attackName"></span><br />
      HP：<span id="hp"></span>/<span id="maxHp"></span> 破壊率：<span id="damage">0</span>%
    </div>

    <canvas id="c" width="700" height="400" tabindex="0" role="button" aria-label="惑星を攻撃。タッチ・クリック・Enter・スペースで攻撃"></canvas>

    <h2 id="msg">惑星をタッチして攻撃！少しずつお金が入る！</h2>

    <div class="shop">
      <div class="sectionTitle">🔫 攻撃を解放・選択</div>
      <div id="attackButtons"></div>

      <div class="sectionTitle">🔄 リセット</div>
      <button onclick="resetGame()">🔄 もう一回</button>
    </div>

    <script type="module" src="../../shared/leaderboard-client.mjs"></script>
<script src="rules.js"></script>
<script src="data.js"></script>
<script src="state.js"></script>
<script src="game.js"></script>
  </body>
</html>
