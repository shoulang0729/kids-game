# とみよこゲームランド オンラインサーバー
# Cloudflare Workers + Durable Objects（合言葉ごとに1つの「部屋」）
name = "tomiyoko-online"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[durable_objects.bindings]]
name = "SNAKE_ROOMS"
class_name = "SnakeRoom"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["SnakeRoom"]
