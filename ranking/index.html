<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ランキング - とみよこゲームランド</title>
  <link rel="icon" href="../assets/icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <a href="../index.html">← ゲームランドへ</a>
  <h1>🏆 みんなのランキング</h1>
  <p>ゲームごとに最高記録を保存。オンラインの勝ち数は対戦結果から記録します。</p>
  <section>
    <h2>自分の記録</h2>
    <label>ランキングの名前 <input id="name" maxlength="12" autocomplete="nickname"></label>
    <button id="save">この名前で記録する</button>
    <p>名前を登録すると、このブラウザで遊んだ記録を送ります。同じ名前でも引継ぎコードが違えば別の記録です。</p>
    <details><summary>別の端末に記録を引き継ぐ</summary>
      <p>このコードを自分の別の端末に入力すると、同じランキング記録を使えます。コードは他の人に渡さないでください。ゲーム途中の状態や所持品は移動しません。</p>
      <button id="show-code">自分のコードを表示</button>
      <output id="code" aria-live="polite"></output>
      <label>引継ぎコード <input id="import-code" autocomplete="off" spellcheck="false" maxlength="64"></label>
      <button id="import">このコードで引き継ぐ</button>
    </details>
    <button id="retry">未送信の記録を再送</button>
    <p id="status" role="status" aria-live="polite"></p>
  </section>
  <section>
    <h2>ゲーム別の記録</h2>
    <label>ゲーム <select id="game"></select></label>
    <label>記録 <select id="metric"></select></label>
    <button id="refresh">再読み込み</button>
    <p id="own"></p>
    <p id="board-status" role="status" aria-live="polite"></p>
    <table><thead><tr><th>順位</th><th>名前</th><th>記録</th></tr></thead><tbody id="rows"></tbody></table>
  </section>
  <p>ソロの記録はゲーム画面から送信した自己記録です。オンライン対戦の結果はサーバーで集計します。接続テスト用デモにはランキングはありません。</p>
</main>
<script type="module" src="page.mjs"></script>
</body></html>
